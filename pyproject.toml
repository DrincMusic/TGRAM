[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlmgraph"
version = "0.1.0"
description = "Graph-memory supervisor for recursive code investigations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2,<2",
  "neo4j>=5,<7",
  "pydantic>=2,<3",
  "tiktoken>=0.8,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
rlmgraph = "rlmgraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rlmgraph"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/scripts", "/dashboard",
  "/pyproject.toml", "/requirements-dev.lock", "/LICENSE", "/README.md",
  "/CONTRIBUTING.md", "/SECURITY.md", "/BASELINE.md",
]
exclude = ["*.tsbuildinfo", "/dashboard/.openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py311"
